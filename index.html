<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link WA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px 80px 20px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button.btn-submit { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 4px; word-break: break-all; }
        a { color: #075e54; font-weight: bold; }

        /* Tombol Floating Scroll Down */
        .scroll-down-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #075e54;
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .scroll-down-btn:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <h2>WhatsApp Link Generator</h2>
    
    <label>Nomor WhatsApp (dengan kode negara tanpa +):</label>
    <input type="number" id="phone" value="62821782920" placeholder="Contoh: 628123456789">

    <label>Pesan Teks Biasa:</label>
    <textarea id="message" rows="8" placeholder="Tulis pesan biasa di sini..."></textarea>

    <button class="btn-submit" onclick="generateWALink()">Buat Link WA</button>

    <div class="result" id="resultArea" style="display:none;">
        <p><strong>Link Hasil:</strong></p>
        <p id="linkOutput"></p>
        <a id="testLink" href="#" target="_blank">Coba Buka Link</a>
    </div>

    <!-- Tombol ↓ Floating -->
    <button id="scrollToBottomBtn" class="scroll-down-btn" onclick="scrollToBottom()" title="Ke Paling Bawah">↓</button>

    <script>
        function generateWALink() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!phone) {
                alert('Silakan masukkan nomor telepon!');
                return;
            }

            const encodedMessage = encodeURIComponent(message);
            const waLink = `https://wa.me/${phone}?text=${encodedMessage}`;

            document.getElementById('linkOutput').innerText = waLink;
            document.getElementById('testLink').href = waLink;
            document.getElementById('resultArea').style.display = 'block';

            checkScroll();
        }

        // Fungsi scroll ke paling bawah halaman
        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Cek posisi scroll untuk menampilkan/menyembunyikan tombol
        function checkScroll() {
            const btn = document.getElementById('scrollToBottomBtn');
            const totalHeight = document.documentElement.scrollHeight;
            const currentPosition = window.innerHeight + window.scrollY;

            // Tombol muncul HANYA JIKA halaman bisa di-scroll dan belum berada di paling bawah
            if (totalHeight > window.innerHeight && (totalHeight - currentPosition) > 50) {
                btn.style.display = 'flex';
            } else {
                btn.style.display = 'none';
            }
        }

        // Event listener saat scroll, ketik teks, atau resize browser
        window.addEventListener('scroll', checkScroll);
        window.addEventListener('resize', checkScroll);
        document.getElementById('message').addEventListener('input', checkScroll);
    </script>

</body>
</html>
